services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssabin-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
    networks:
      - laravel

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: ssabin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: ssabin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ssabin_db
      MYSQL_USER: ssabin_user
      MYSQL_PASSWORD: FGmAJ2MDu3jNs
      MYSQL_ROOT_PASSWORD: FGmAJ2MDu3jNsabin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    container_name: ssabin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel


networks:
  laravel:


volumes:
  mysql_data:

