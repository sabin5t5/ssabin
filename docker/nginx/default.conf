server {

    listen 80;

    server_name ssabin.com.np;

    root /var/www/html/public;

    index index.php index.html;


    location / {

        try_files $uri $uri/ /index.php?$query_string;

    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ \.php$ {

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    }


    location ~ /\.ht {

        deny all;

    }

}
server {

    listen 443 ssl;
    http2 on;

    server_name ssabin.com.np;

    ssl_certificate     /etc/letsencrypt/live/ssabin.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssabin.com.np/privkey.pem;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    location / {

        try_files $uri $uri/ /index.php?$query_string;

    }

    location ~ \.php$ {

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    }

    location ~ /\.(?!well-known).* {

        deny all;

    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf)$ {

        expires 30d;

        access_log off;

    }

}
